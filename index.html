<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나에게 주는 선물</title>

<style>
body{
  margin:0;
  font-family: 'Pretendard', Arial, sans-serif;
  background:#fff;
  overflow:hidden;
}

/* 전체화면 버튼 */
.full-btn{
  position:fixed;
  right:10px;
  top:10px;
  padding:6px 10px;
  background:#000;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  z-index:1000;
  font-size:12px;
}

/* 메인 그리드 영역 */
.wrapper{
  padding:16px 32px;
  display:flex;
  flex-direction:column;
  height:100vh;
  box-sizing:border-box;
}

.grid{
  flex:1;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap:10px;
}

.item{
  cursor:pointer;
  overflow:hidden;
  border-radius:12px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  background: #f9f9f9;
}

.item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.2s;
}

.item:active img{
  transform:scale(0.95);
}

/* 팝업 레이어 */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#fff;
  display:none;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  z-index:999;
}

/* 1단계 안내 문구 스타일 */
.gift-message {
  font-size: 22px;
  font-weight: bold;
  color: #444;
  text-align: center;
  cursor: pointer;
  padding: 40px;
  border: 3px solid #ffd1d1;
  border-radius: 30px;
  background: #fffafa;
  line-height: 1.6;
}

/* 2단계 선물 이미지 스타일 */
.popup img#popupImg{
  width:90%;
  max-height:80%;
  object-fit: contain;
  border-radius: 15px;
  display: none;
}

/* 닫기 버튼 */
.close{
  position:absolute;
  top:15px;
  right:20px;
  font-size:35px;
  cursor:pointer;
  z-index: 1001;
  color: #999;
}

/* 클릭 시 터지는 하트 */
.heart{
  position:absolute;
  width:60px;
  animation:pop 0.5s ease-out;
  pointer-events:none;
}

@keyframes pop{
  0%{transform:scale(0); opacity:1;}
  100%{transform:scale(1.5); opacity:0;}
}
</style>
</head>

<body>

<button class="full-btn" id="fullBtn" onclick="goFull()">전체화면</button>

<div class="wrapper">
  <div class="grid">
    <div class="item" onclick="openStep1(event,'present.png')"><img src="01.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="02.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="03.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="04.png"></div>

    <div class="item" onclick="openStep1(event,'present.png')"><img src="05.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="06.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="07.png"></div>
    <div class="item" onclick="openStep1(event,'present.png')"><img src="08.png"></div>
  </div>
</div>

<div class="popup" id="popup">
  <div class="close" onclick="closePopup()">✖</div>
  
  <div id="step1Content" class="gift-message" onclick="openStep2()">
    🎁<br>
    소중한 나에게<br>선물합니다<br>
    <span style="font-size:14px; color:#aaa; font-weight:normal;">(터치하여 선물을 확인하세요)</span>
  </div>

  <img id="popupImg">
</div>

<script>
let currentGiftSrc = ""; 

function openStep1(e, imgSrc){
  // 하트 애니메이션
  for(let i=0; i<3; i++){
    let heart = document.createElement("img");
    heart.src = "heart.png";
    heart.className = "heart";
    heart.style.left = (e.clientX - 30 + (Math.random()*40-20)) + "px";
    heart.style.top = (e.clientY - 30 + (Math.random()*40-20)) + "px";
    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(), 500);
  }

  currentGiftSrc = imgSrc; 
  document.getElementById("step1Content").style.display = "block";
  document.getElementById("popupImg").style.display = "none";
  document.getElementById("popup").style.display = "flex";
}

function openStep2(){
  document.getElementById("step1Content").style.display = "none";
  const imgTag = document.getElementById("popupImg");
  imgTag.src = currentGiftSrc; 
  imgTag.style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function goFull(){
  let doc = document.documentElement;
  if(doc.requestFullscreen) doc.requestFullscreen();
  document.getElementById("fullBtn").style.display = "none";
  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}
</script>

</body>
</html>
