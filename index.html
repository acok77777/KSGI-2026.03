<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나에게 주는 선물</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#fff;
  overflow:hidden;
}

.full-btn{
  position:fixed;
  right:10px;
  top:10px;
  padding:6px 10px;
  background:#000;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  z-index:1000;
  font-size:12px;
}

.wrapper{
  padding:16px 32px;
  display:flex;
  flex-direction:column;
  height:100vh;
  box-sizing:border-box;
}

.grid{
  flex:1;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap:10px;
}

.item{
  cursor:pointer;
  overflow:hidden;
  border-radius:12px;
}

.item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.2s;
}

.item:active img{
  transform:scale(0.95);
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup img{
  width:95%;
  max-height:95%;
  cursor:pointer;
}

/* 👉 화살표 버튼 */
.arrow{
  position:absolute;
  top:20px;
  right:20px;
  font-size:40px;
  cursor:pointer;
  user-select:none;
}

.heart{
  position:absolute;
  width:60px;
  animation:pop 0.5s ease-out;
  pointer-events:none;
}

@keyframes pop{
  0%{transform:scale(0); opacity:1;}
  100%{transform:scale(1.5); opacity:0;}
}
</style>
</head>

<body>

<button class="full-btn" id="fullBtn" onclick="goFull()">전체화면</button>

<div class="wrapper">
  <div class="grid">

    <div class="item" onclick="openPopup(event,'health.png')"><img src="01.png"></div>
    <div class="item" onclick="openPopup(event,'love.png')"><img src="02.png"></div>
    <div class="item" onclick="openPopup(event,'cheer.png')"><img src="03.png"></div>
    <div class="item" onclick="openPopup(event,'rest.png')"><img src="04.png"></div>

    <div class="item" onclick="openPopup(event,'freedom.png')"><img src="05.png"></div>
    <div class="item" onclick="openPopup(event,'thanks.png')"><img src="06.png"></div>
    <div class="item" onclick="openPopup(event,'courage.png')"><img src="07.png"></div>
    <div class="item" onclick="openPopup(event,'hope.png')"><img src="08.png"></div>

  </div>
</div>

<div class="popup" id="popup">
  <div class="arrow" id="arrow">▶</div>
  <img id="popupImg">
</div>

<script>

let state = 0; 
// 0 = 첫 팝업
// 1 = 두번째 팝업

function openPopup(e, imgSrc){

  state = 0;

  let x = e.clientX || window.innerWidth/2;
  let y = e.clientY || window.innerHeight/2;

  // 하트 효과
  for(let i=0;i<3;i++){
    let heart = document.createElement("img");
    heart.src = "heart.png";
    heart.className = "heart";

    heart.style.left = (x - 30 + (Math.random()*40-20)) + "px";
    heart.style.top = (y - 30 + (Math.random()*40-20)) + "px";

    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(),500);
  }

  setTimeout(()=>{
    const img = document.getElementById("popupImg");
    const arrow = document.getElementById("arrow");

    img.src = imgSrc;
    document.getElementById("popup").style.display = "flex";

    // 👉 이미지 클릭
    img.onclick = nextStep;

    // 👉 화살표 클릭
    arrow.onclick = nextStep;

  },150);
}

function nextStep(){

  const img = document.getElementById("popupImg");

  // 👉 첫 → 두번째
  if(state === 0){
    img.src = "present.png";
    state = 1;
  }
  // 👉 두번째 → 종료
  else{
    document.getElementById("popup").style.display = "none";
  }
}

function goFull(){
  let doc = document.documentElement;

  if(doc.requestFullscreen){
    doc.requestFullscreen();
  }

  document.getElementById("fullBtn").style.display = "none";

  if(screen.orientation && screen.orientation.lock){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}

</script>

</body>
</html>
